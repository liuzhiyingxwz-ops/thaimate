<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泰伴 ThaiMate AI</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#111;color:#fff;padding:20px}
.card{background:#1d1d24;padding:20px;border-radius:24px;margin-bottom:18px}
textarea{width:100%;height:120px;border-radius:16px;background:#292933;color:#fff;border:0;padding:15px;font-size:18px;box-sizing:border-box}
button{background:#f45b8a;color:white;border:0;border-radius:16px;padding:14px 20px;font-size:17px}
.result{white-space:pre-wrap;line-height:1.8}
</style>
</head>
<body>
<h1>🇹🇭 泰伴 ThaiMate AI</h1>
<div class="card">
<h2>输入泰语</h2>
<textarea id="input">ฉันคิดถึงเธอมาก</textarea><br><br>
<button onclick="analyze()">开始分析</button>
</div>
<div class="card">
<h2>AI分析</h2>
<div id="result">等待输入...</div>
</div>
<script>
const API="https://thaimate-ai.liuzhiyingxwz.workers.dev";
async function analyze(){
 const text=document.getElementById("input").value.trim();
 const box=document.getElementById("result");
 box.innerText="分析中...";
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
  const d=await r.json();
  box.innerText=d.choices?.[0]?.message?.content || JSON.stringify(d,null,2);
 }catch(e){box.innerText="连接失败："+e.message}
}
</script>
</body>
</html>
