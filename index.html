<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泰伴 ThaiMate AI V3</title>
<style>
body{background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:20px}
.card{background:#202027;border-radius:22px;padding:20px;margin-bottom:18px}
textarea{width:100%;height:120px;border:0;border-radius:16px;background:#2b2b35;color:#fff;padding:15px;font-size:18px;box-sizing:border-box}
button{border:0;border-radius:16px;padding:14px 22px;background:#f45b8a;color:#fff;font-size:17px;font-weight:bold}
h2{margin-top:0}
.result{line-height:1.8;white-space:pre-wrap}
.tag{color:#ff77a8}
</style>
</head>
<body>

<h1>🇹🇭 泰伴 ThaiMate AI</h1>

<div class="card">
<h2>今天想学哪句泰语？</h2>
<textarea id="input">ฉันคิดถึงเธอมาก</textarea>
<br><br>
<button onclick="analyze()">开始分析</button>
</div>

<div class="card">
<h2>AI老师分析</h2>
<div id="result" class="result">等待分析...</div>
</div>

<script>
const API="https://thaimate-ai.liuzhiyingxwz.workers.dev";

async function analyze(){
 const text=document.getElementById("input").value;
 const box=document.getElementById("result");
 box.innerHTML="⏳ AI分析中...";

 try{
 const r=await fetch(API,{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({text})
 });
 const d=await r.json();

 let answer=d.choices?.[0]?.message?.content || JSON.stringify(d,null,2);
 answer=answer.replace(/^###/gm,"").replace(/\*\*/g,"");

 box.innerHTML=answer;
 }catch(e){
 box.innerHTML="连接失败："+e.message;
 }
}
</script>

</body>
</html>
