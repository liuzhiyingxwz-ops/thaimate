<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f75b8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="泰伴">
  <title>泰伴 ThaiMate</title>
  <style>
    :root{
      --pink:#f75b8a;--pink2:#df3f73;--bg:#f7f7fb;--card:#fff;
      --text:#17171c;--muted:#70707b;--line:#ececf2;
      --shadow:0 12px 30px rgba(25,25,55,.08)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans Thai",sans-serif;
      background:var(--bg);color:var(--text);
      padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))
    }
    #app{max-width:760px;margin:auto}
    header{
      position:sticky;top:0;z-index:5;padding:18px 16px 8px;
      background:rgba(247,247,251,.9);backdrop-filter:blur(18px)
    }
    .eyebrow{font-size:13px;color:var(--muted)}
    h1{margin:2px 0 0;font-size:30px}
    main{padding:8px 14px 22px}
    .card{
      background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)
    }
    h2{font-size:23px;margin:0 0 14px}
    h3{font-size:18px;margin:0}
    textarea{
      width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);
      border-radius:18px;padding:14px;font:inherit;font-size:19px;line-height:1.55;
      background:#fafafd;color:var(--text);outline:none
    }
    textarea:focus{border-color:var(--pink)}
    button{font:inherit;border:0;cursor:pointer}
    .row{display:flex;gap:10px;margin-top:12px}
    .primary,.secondary{
      border-radius:15px;padding:12px 16px;font-weight:700;flex:1
    }
    .primary{background:var(--pink);color:#fff}
    .primary:active{background:var(--pink2)}
    .secondary{background:#f1f1f6;color:var(--text)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .linkbtn{background:transparent;color:var(--pink);padding:8px}
    .translation{font-size:24px;font-weight:800;margin:16px 0 8px}
    .muted{color:var(--muted);line-height:1.6}
    .word-list,.saved-list{display:grid;gap:10px;margin-top:14px}
    .word{
      display:flex;justify-content:space-between;gap:12px;padding:14px;border-radius:17px;background:#f8f8fc
    }
    .thai{font-size:22px;font-weight:800}
    .meta,.note{color:var(--muted);margin-top:4px}
    .note{font-size:13px;line-height:1.5}
    .speak{background:transparent;font-size:20px}
    .practice{display:flex;align-items:center;gap:18px;margin-top:16px}
    .mic{
      width:80px;height:80px;border-radius:50%;background:var(--pink);color:#fff;font-size:32px;
      box-shadow:0 10px 25px rgba(247,91,138,.32)
    }
    .mic.recording{background:#e63737;animation:pulse 1.1s infinite}
    @keyframes pulse{50%{transform:scale(1.06)}}
    .score{margin-top:18px;padding:18px;border-radius:20px;background:#fff4f7}
    .score-big{text-align:center;font-size:58px;font-weight:900;color:var(--pink)}
    .score-label{text-align:center;color:var(--muted)}
    .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .score-grid div{background:#fff;padding:14px;border-radius:14px;text-align:center}
    .score-grid strong{display:block;font-size:26px}
    .score-grid span{font-size:13px;color:var(--muted)}
    .saved-item{
      padding:13px 14px;border-radius:16px;background:#f8f8fc;
      display:flex;justify-content:space-between;align-items:center;gap:12px
    }
    .saved-item button{background:transparent;color:var(--pink)}
    .notice p{font-size:14px;color:var(--muted);line-height:1.6}
    nav{
      position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:10;
      width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);
      background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);
      padding:10px 10px calc(10px + env(safe-area-inset-bottom))
    }
    nav button{background:transparent;padding:8px;color:var(--muted)}
    .hidden{display:none!important}
    @media(prefers-color-scheme:dark){
      :root{--bg:#101014;--card:#1b1b21;--text:#f6f6f8;--muted:#aaaab4;--line:#303038;--shadow:none}
      header{background:rgba(16,16,20,.88)}
      textarea,.word,.saved-item,.score-grid div{background:#24242b}
      .secondary{background:#2b2b33;color:var(--text)}
      nav{background:rgba(27,27,33,.95)}
      .score{background:#2a1d23}
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">สวัสดี · 你好</div>
    <h1>泰伴</h1>
  </header>

  <main>
    <section class="card">
      <h2>今天想学哪句泰语？</h2>
      <textarea id="thaiInput">ฉันคิดถึงเธอมาก</textarea>
      <div class="row">
        <button id="analyzeBtn" class="primary">开始分析</button>
        <button id="clearBtn" class="secondary">清空</button>
      </div>
    </section>

    <section id="result" class="hidden">
      <section class="card">
        <div class="section-head">
          <h3>中文意思</h3>
          <button id="speakBtn" class="linkbtn">🔊 标准音</button>
        </div>
        <p id="translation" class="translation"></p>
        <p id="natural" class="muted"></p>
        <div class="row">
          <button id="slowBtn" class="secondary">🐢 慢速</button>
          <button id="favBtn" class="secondary">☆ 收藏</button>
        </div>
      </section>

      <section class="card">
        <h3>单词拆解</h3>
        <div id="words" class="word-list"></div>
      </section>

      <section class="card">
        <h3>跟读练习</h3>
        <p class="muted">先听标准音，再点击麦克风跟读。</p>
        <div class="practice">
          <button id="micBtn" class="mic">🎤</button>
          <div>
            <div id="status"><strong>点击开始跟读</strong></div>
            <div id="recognized" class="muted"></div>
          </div>
        </div>
        <div id="scoreBox" class="score hidden">
          <div id="total" class="score-big">0</div>
          <div class="score-label">总分</div>
          <div class="score-grid">
            <div><strong id="accuracy">0</strong><span>准确度</span></div>
            <div><strong id="fluency">0</strong><span>流畅度</span></div>
          </div>
          <p id="feedback" class="muted"></p>
        </div>
      </section>
    </section>

    <section class="card">
      <div class="section-head">
        <h3>收藏</h3>
        <button id="clearFavs" class="linkbtn">清空</button>
      </div>
      <div id="favorites" class="saved-list muted">还没有收藏</div>
    </section>

    <section class="card">
      <div class="section-head">
        <h3>学习记录</h3>
        <button id="clearHistory" class="linkbtn">清空</button>
      </div>
      <div id="history" class="saved-list muted">还没有学习记录</div>
    </section>

    <section class="card notice">
      <h3>当前版本说明</h3>
      <p>内置示例句支持完整翻译与拆词。任意泰语句子的自动翻译、纠错和语法解释，需要后续连接 AI 接口。</p>
      <p>iPhone Safari 对网页语音识别的支持会受系统版本影响；朗读功能通常可以使用。</p>
    </section>
  </main>

  <nav>
    <button data-go="top">学习</button>
    <button data-go="favorites">收藏</button>
    <button data-go="history">记录</button>
  </nav>
</div>

<script>
const examples={
"ฉันคิดถึงเธอมาก":{
 translation:"我非常想你。",
 natural:"很自然的口语表达，可用于亲近的人之间。",
 words:[
  ["ฉัน","chǎn","我","常见第一人称代词。"],
  ["คิดถึง","khít-thʉ̌ng","想念","固定搭配，整体表示“想念”。"],
  ["เธอ","thəə","你","多用于关系较亲近的人。"],
  ["มาก","mâak","很、非常","放在后面加强程度。"]
 ]},
"อยากจะรักษาใจ ไม่อยากให้โกรธอีก":{
 translation:"想守护自己的心，不想再生气了。",
 natural:"带有歌词感和情绪色彩的表达。",
 words:[
  ["อยาก","yàak","想","表示愿望。"],["จะ","jà","将、要","放在动词前。"],
  ["รักษา","rák-sǎa","保护、治疗","这里是守护的意思。"],["ใจ","jai","心","也可引申为内心、情感。"],
  ["ไม่","mâi","不","否定词。"],["โกรธ","kròot","生气","动词。"],["อีก","ìik","再、又","放在句末表示再次。"]
 ]}
};
const $=id=>document.getElementById(id);
let current=null,recognition=null,recording=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function analyze(t){
 const v=t.trim();if(!v)return null;
 if(examples[v])return {original:v,...examples[v]};
 return {
  original:v,
  translation:"这个句子需要连接 AI 后端后才能自动翻译。",
  natural:"当前单文件版仍可朗读、收藏和尝试跟读。",
  words:v.split(/\s+/).filter(Boolean).map(w=>[w,"—","待分析","连接 AI 后显示详细解释。"])
 };
}
function speak(t,r=.82){
 if(!("speechSynthesis" in window)){alert("当前浏览器不支持朗读。");return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="th-TH";u.rate=r;
 const vs=speechSynthesis.getVoices();const tv=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("th"));
 if(tv)u.voice=tv;speechSynthesis.speak(u)
}
function store(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function isFav(t){return store("favorites").includes(t)}
function addHistory(t){let a=store("history").filter(x=>x!==t);a.unshift(t);save("history",a.slice(0,30))}
function render(d){
 current=d;$("translation").textContent=d.translation;$("natural").textContent=d.natural;$("words").innerHTML="";
 d.words.forEach(([th,ro,zh,no])=>{
  const el=document.createElement("div");el.className="word";
  el.innerHTML=`<div><div class="thai">${esc(th)}</div><div class="meta">${esc(ro)} · ${esc(zh)}</div><div class="note">${esc(no)}</div></div><button class="speak">🔊</button>`;
  el.querySelector("button").onclick=()=>speak(th,.55);$("words").appendChild(el)
 });
 $("favBtn").textContent=isFav(d.original)?"★ 已收藏":"☆ 收藏";
 $("result").classList.remove("hidden");addHistory(d.original);renderSaved();window.scrollTo({top:0,behavior:"smooth"})
}
function renderList(id,key){
 const el=$(id),arr=store(key);el.innerHTML="";
 if(!arr.length){el.className="saved-list muted";el.textContent=key==="favorites"?"还没有收藏":"还没有学习记录";return}
 el.className="saved-list";
 arr.forEach(t=>{const x=document.createElement("div");x.className="saved-item";x.innerHTML=`<span>${esc(t)}</span><button>打开</button>`;
 x.querySelector("button").onclick=()=>{$("thaiInput").value=t;render(analyze(t))};el.appendChild(x)})
}
function renderSaved(){renderList("favorites","favorites");renderList("history","history")}
function clean(s){return s.replace(/\s+/g,"").trim()}
function lev(a,b){
 const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return d[m][n]
}
function score(target,heard){
 const a=[...clean(target)],b=[...clean(heard)],max=Math.max(a.length,b.length,1);
 const sim=Math.max(0,1-lev(a,b)/max),acc=Math.round(sim*100),flu=b.length?Math.min(100,70+Math.round(sim*30)):0,total=Math.round(acc*.75+flu*.25);
 $("total").textContent=total;$("accuracy").textContent=acc;$("fluency").textContent=flu;
 $("feedback").textContent=acc>=90?"识别结果与目标句非常接近。继续保持！":acc>=70?"整体不错，可以再注意漏读或发音不清的部分。":"建议先慢速逐词跟读，再练整句。";
 $("scoreBox").classList.remove("hidden")
}
function setupRec(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
 const r=new SR();r.lang="th-TH";r.interimResults=true;r.continuous=false;
 r.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$("recognized").textContent=t};
 r.onerror=()=>{recording=false;$("micBtn").classList.remove("recording");$("status").textContent="识别失败，请再试一次"};
 r.onend=()=>{if(!recording)return;recording=false;$("micBtn").classList.remove("recording");$("status").textContent="录音结束";
 const h=$("recognized").textContent.trim();if(current&&h)score(current.original,h)};
 return r
}
$("analyzeBtn").onclick=()=>{const d=analyze($("thaiInput").value);if(!d){alert("请先输入一句泰语。");return}render(d)};
$("clearBtn").onclick=()=>{$("thaiInput").value="";$("result").classList.add("hidden");current=null};
$("speakBtn").onclick=()=>current&&speak(current.original,.82);
$("slowBtn").onclick=()=>current&&speak(current.original,.52);
$("favBtn").onclick=()=>{if(!current)return;let a=store("favorites");a=a.includes(current.original)?a.filter(x=>x!==current.original):[current.original,...a];save("favorites",a);$("favBtn").textContent=a.includes(current.original)?"★ 已收藏":"☆ 收藏";renderSaved()};
$("clearFavs").onclick=()=>{if(confirm("确定清空全部收藏吗？")){save("favorites",[]);renderSaved()}};
$("clearHistory").onclick=()=>{if(confirm("确定清空全部学习记录吗？")){save("history",[]);renderSaved()}};
$("micBtn").onclick=()=>{
 if(!current){alert("请先分析一句泰语。");return}
 if(!recognition)recognition=setupRec();
 if(!recognition){alert("当前 Safari 版本不支持网页语音识别。你仍可使用朗读功能。");return}
 if(recording){recording=false;recognition.stop();$("micBtn").classList.remove("recording");$("status").textContent="正在生成结果…"}
 else{$("recognized").textContent="";$("scoreBox").classList.add("hidden");recording=true;$("micBtn").classList.add("recording");$("status").textContent="正在听你跟读…";try{recognition.start()}catch{recording=false}}
};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const id=b.dataset.go;if(id==="top")window.scrollTo({top:0,behavior:"smooth"});else $(id).scrollIntoView({behavior:"smooth",block:"center"})});
renderSaved();render(analyze($("thaiInput").value));
</script>
</body>
</html>
