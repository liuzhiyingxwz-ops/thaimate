<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>泰伴 ThaiMate V6.1</title>


<style>

body{
background:#11131a;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
padding:8px;
}


h1{
font-size:32px;
}


.card{
background:#20232d;
border-radius:22px;
padding:16px;
margin-bottom:20px;
}


textarea{

width:100%;
height:120px;
background:#292d38;
border:0;
border-radius:16px;
padding:15px;
color:white;
font-size:18px;

}


button{

border:0;
border-radius:15px;
padding:14px 22px;
background:#ff5b9a;
color:white;
font-size:17px;
font-weight:bold;

}


.result{

line-height:1.8;
font-size:17px;

}


.thai{

color:#ff75ad;
font-size:22px;
font-weight:bold;

}


.sound{

background:#343846;
padding:6px 12px;
border-radius:12px;
margin-left:8px;
cursor:pointer;

}


.title{

font-size:22px;
font-weight:bold;
margin-top:20px;

}

.app-header{

background:#20232d;

padding:8px;

border-radius:22px;

margin-bottom:20px;

text-align:center;

}


.app-header h1{

font-size:28px;

margin:0;

}


.app-header p{

color:#ff75ad;

font-size:15px;

margin-top:5px;

}
.learn-card h2{

font-size:22px;

margin-bottom:15px;

}


.learn-card textarea{

box-sizing:border-box;

}
.word-card{

background:#292d38;

border-radius:18px;

padding:15px;

margin:15px 0;

border-left:5px solid #ff75ad;

}

.word-card h3{

color:#ff75ad;

font-size:24px;

margin-bottom:10px;

}

.word-card p{

font-size:16px;

line-height:1.8;

}
</style>

</head>


<body>


<div class="app-header">

<h1>
🇹🇭 ThaiMate
</h1>

<p>
每天学一句泰语
</p>

</div>


<div class="card learn-card">


<h2>
今天想学哪句泰语？
</h2>


<textarea id="input"
placeholder="输入泰语，例如：ฉันคิดถึงเธอมาก">
</textarea>


<br><br>


<button onclick="analyze()">
开始分析
</button>


<div style="margin-top:15px">

<button onclick="speakFull()">🔊 播放整句</button>

<select id="speed">
<option value="0.6">慢速</option>
<option value="1" selected>正常</option>
<option value="1.4">快速</option>
</select>
 
<button onclick="showHistory()">📚 学习记录</button>
</div>


</div>


<div class="card result" id="output">

等待分析...

</div>
<script>


// 泰语发音

function speakThai(text, speed=1){

let speech = new SpeechSynthesisUtterance(text);

speech.lang="th-TH";

speech.rate=speed;

speechSynthesis.cancel();

speechSynthesis.speak(speech);

}
function speakFull(){

let text=document.getElementById("input").value;

let speed=document.getElementById("speed").value;

speakThai(text,Number(speed));

}


// AI分析

async function analyze(){

let text=document.getElementById("input").value;

let output=document.getElementById("output");


if(!text){

output.innerHTML="请输入泰语";

return;

}


output.innerHTML="AI分析中...";


try{


let res=await fetch(
"https://thaimate-ai.liuzhiyingxwz.workers.dev/",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

text:text

})

}

);



let result=await res.text();


// 添加播放按钮

let clean = result.replace(/\*\*/g,"");


let html = clean

.replace(
/([\u0E00-\u0E7F]+)/g,
'<span class="thai">$1 <span class="sound" onclick="speakThai(\'$1\')">🔊</span></span>'
)

.replace(
/### (.*)/g,
'<div class="title">$1</div>'
)

.replace(
/\n/g,
"<br>"
);


output.innerHTML=html;


// 保存记录

saveHistory(text,result);



}

catch(e){

output.innerHTML="连接失败："+e.message;

}


}



// 慢速播放示例

function slowSpeak(text){

speakThai(text,0.5);

}



// 历史记录

function saveHistory(word,result){

let list=
JSON.parse(
localStorage.getItem("thaiHistory")||"[]"
);


list.unshift({

word:word,

result:result,

time:new Date().toLocaleString()

});


localStorage.setItem(
"thaiHistory",
JSON.stringify(list.slice(0,30))
);


}
function showHistory(){

let list = JSON.parse(localStorage.getItem("thaiHistory") || "[]");

if(list.length===0){
alert("还没有学习记录");
return;
}

let html = `
<div style="
position:fixed;
top:10%;
left:5%;
right:5%;
background:#20232d;
color:white;
padding:20px;
border-radius:20px;
z-index:999;
max-height:70vh;
overflow:auto;
">

<h2>📚 学习记录</h2>
`;

list.forEach((item,index)=>{

html += `
<div style="
background:#292d38;
padding:15px;
margin:12px 0;
border-radius:15px;
">

<div style="
font-size:20px;
color:#ff75ad;
font-weight:bold;
">
${item.word}
</div>

<br>

<button onclick="speakThai('${item.word}')">
🔊播放
</button>

<button onclick="loadHistory(${index})">
🔄重新分析
</button>

</div>
`;

});


html += `
<button onclick="closeHistory()">
关闭
</button>

</div>
`;

let div=document.createElement("div");

div.id="historyBox";

div.innerHTML=html;

document.body.appendChild(div);

}
function closeHistory(){

let box=document.getElementById("historyBox");

if(box){
box.remove();
}

}


function loadHistory(index){

let list = JSON.parse(localStorage.getItem("thaiHistory") || "[]");

if(list[index]){

document.getElementById("input").value=list[index].word;

closeHistory();

analyze();

}

}


</script>


</body>

</html>
