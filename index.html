<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ThaiMate V7</title>

<style>

body{
background:#11131a;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
padding:10px;
}


h1{
text-align:center;
font-size:28px;
}


.card{

background:#20232d;
border-radius:18px;
padding:15px;
margin-top:15px;

}


.tabs{

display:flex;
gap:8px;
margin-bottom:15px;

}


.tab{

flex:1;
padding:12px 5px;
border-radius:14px;
background:#292d38;
text-align:center;
cursor:pointer;

}


.tab.active{

background:#ff5b9a;

}


textarea{

width:100%;
height:80px;

background:#292d38;
border:0;
border-radius:14px;

padding:12px;
box-sizing:border-box;

color:white;
font-size:17px;

}


button{

background:#ff5b9a;
color:white;

border:0;

border-radius:14px;

padding:10px 18px;

font-weight:bold;

margin-top:10px;

}


.result{

margin-top:15px;

line-height:1.6;

}


.hidden{

display:none;

}


.word-card{

background:#292d38;

border-radius:14px;

padding:12px;

margin-top:10px;

}


.thai{

color:#ff75ad;

font-size:20px;

font-weight:bold;

}


.sound{

background:#343846;

padding:3px 8px;

margin-left:5px;

}



.small{

font-size:15px;

}


</style>

</head>


<body>


<h1>
🇹🇭 ThaiMate V7
</h1>



<div class="card">


<div class="tabs">


<div class="tab active" onclick="showTab('sentence',this)">
🗣句子
</div>


<div class="tab" onclick="showTab('word',this)">
🔤单词
</div>


<div class="tab" onclick="showTab('book',this)">
📖单词本
</div>


</div>




<!-- 句子 -->

<div id="sentence">


<textarea placeholder="输入泰语句子">

</textarea>


<br>

<button>
开始分析
</button>


<div class="result">

等待分析...

</div>


</div>






<!-- 单词 -->


<div id="word" class="hidden">


<textarea placeholder="输入泰语单词">

</textarea>


<br>

<button>
分析单词
</button>


<div class="result">

等待分析...

</div>


</div>






<!-- 单词本 -->


<div id="book" class="hidden">


<div class="word-card">

<div class="thai">
ไฟ 🔊 fai /faj/
</div>

<div>
火、电灯 · 名词
</div>


</div>



<div class="word-card">

<div class="thai">
คิดถึง 🔊 khít-thǔng
</div>

<div>
想念 · 动词
</div>

</div>



</div>



</div>



<script>


function showTab(id,btn){

document.querySelectorAll(".tabs .tab")
.forEach(x=>x.classList.remove("active"));


btn.classList.add("active");


document.getElementById("sentence").classList.add("hidden");

document.getElementById("word").classList.add("hidden");

document.getElementById("book").classList.add("hidden");


document.getElementById(id).classList.remove("hidden");


}


</script>


</body>

</html>
