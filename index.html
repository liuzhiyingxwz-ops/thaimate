<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>泰伴 ThaiMate V6</title>

<style>

body{
background:#11131a;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
padding:20px;
}

.card{
background:#20232d;
border-radius:22px;
padding:20px;
margin-bottom:18px;
}

h1{
font-size:32px;
}

textarea{
width:100%;
height:120px;
background:#292d38;
border:0;
border-radius:16px;
padding:15px;
color:white;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:16px;
background:#ff5b9a;
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

.result{
white-space:pre-wrap;
line-height:1.8;
}

.small{
color:#aaa;
}

</style>

<!-- Google 登录 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

</head>


<body>


<h1>
🇹🇭 泰伴 ThaiMate
</h1>


<div class="card">

<h2>
今天想学哪句泰语？
</h2>


<textarea id="thaiInput"
placeholder="输入泰语，例如：

ฉันคิดถึงเธอมาก
">
</textarea>


<button onclick="analyze()">
开始 AI 分析
</button>


</div>



<div class="card">

<h2>
AI分析结果
</h2>


<div id="output" class="result">

等待分析...

</div>


</div>



<div class="card">

<h2>
学习记录
</h2>


<div id="history">

暂无记录

</div>


</div>




<script>


// 你的 Cloudflare Worker 地址

const API_URL =
"https://thaimate-ai.liuzhiyingxwz.workers.dev";




// 调用AI

async function analyze(){


let text =
document.getElementById("thaiInput").value;


if(!text){

alert("请输入泰语");

return;

}


let output =
document.getElementById("output");


output.innerText="AI分析中...";


try{


let res =
await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

text:text

})

});



let data =
await res.json();



let result =
data.choices[0].message.content;



output.innerText=result;



saveHistory(
text,
result
);



}catch(e){


output.innerText=
"连接失败："+e;


}


}




// 保存学习记录


function saveHistory(word,result){


let list =
JSON.parse(
localStorage.getItem("thaiHistory")||"[]"
);


list.unshift({

word,
result,
time:new Date().toLocaleString()

});


localStorage.setItem(
"thaiHistory",
JSON.stringify(list)
);


loadHistory();


}




function loadHistory(){


let list =
JSON.parse(
localStorage.getItem("thaiHistory")||"[]"
);



let box =
document.getElementById("history");



if(list.length===0){

box.innerHTML="暂无记录";

return;

}



box.innerHTML =
list.slice(0,10)
.map(x=>`

<div class="card">

<b>${x.word}</b>

<br>

<span class="small">
${x.time}
</span>

</div>

`)
.join("");

}


loadHistory();



</script>


</body>
</html>
