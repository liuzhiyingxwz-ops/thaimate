<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>泰伴 ThaiMate V6.1</title>


<style>

body{
background:#11131a;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
padding:20px;
}


h1{
font-size:32px;
}


.card{
background:#20232d;
border-radius:22px;
padding:20px;
margin-bottom:20px;
}


textarea{

width:100%;
height:120px;
background:#292d38;
border:0;
border-radius:16px;
padding:15px;
color:white;
font-size:18px;

}


button{

border:0;
border-radius:15px;
padding:14px 22px;
background:#ff5b9a;
color:white;
font-size:17px;
font-weight:bold;

}


.result{

line-height:1.8;
font-size:17px;

}


.thai{

color:#ff75ad;
font-size:22px;
font-weight:bold;

}


.sound{

background:#343846;
padding:6px 12px;
border-radius:12px;
margin-left:8px;
cursor:pointer;

}


.title{

font-size:22px;
font-weight:bold;
margin-top:20px;

}


</style>

</head>


<body>


<h1>
🇹🇭 泰伴 ThaiMate
</h1>


<div class="card">


<h2>
今天想学哪句泰语？
</h2>


<textarea id="input"
placeholder="输入泰语，例如：ฉันคิดถึงเธอมาก">
</textarea>


<br><br>


<button onclick="analyze()">
开始分析
</button>


</div>


<div class="card result" id="output">

等待分析...

</div>
<script>


// 泰语发音

function speakThai(text, speed=1){

let speech = new SpeechSynthesisUtterance(text);

speech.lang="th-TH";

speech.rate=speed;

speechSynthesis.cancel();

speechSynthesis.speak(speech);

}



// AI分析

async function analyze(){

let text=document.getElementById("input").value;

let output=document.getElementById("output");


if(!text){

output.innerHTML="请输入泰语";

return;

}


output.innerHTML="AI分析中...";


try{


let res=await fetch(
"https://thaimate-ai.liuzhiyingxwz.workers.dev/",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

text:text

})

}

);



let result=await res.text();


// 添加播放按钮

let html=result

.replace(
/(ฉัน|คิดถึง|เธอ|มาก|ครับ|ค่ะ|ไม่|ใช่|รัก)/g,

'<span class="thai">$1 <span class="sound" onclick="speakThai(\'$1\')">🔊</span></span>'

)

.replace(
/### (.*)/g,
'<div class="title">$1</div>'
)

.replace(
/\n/g,
"<br>"
);



output.innerHTML=html;


// 保存记录

saveHistory(text,result);



}

catch(e){

output.innerHTML="连接失败："+e.message;

}


}



// 慢速播放示例

function slowSpeak(text){

speakThai(text,0.5);

}



// 历史记录

function saveHistory(word,result){

let list=
JSON.parse(
localStorage.getItem("thaiHistory")||"[]"
);


list.unshift({

word:word,

result:result,

time:new Date().toLocaleString()

});


localStorage.setItem(
"thaiHistory",
JSON.stringify(list.slice(0,30))
);


}



</script>


</body>

</html>
