<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ThaiMate V7</title>


<style>

body{
background:#11131a;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
padding:10px;
}


.card{

background:#20232d;
border-radius:20px;
padding:18px;
margin-bottom:16px;

}


h1{

text-align:center;
font-size:30px;

}


h2{

font-size:22px;
margin-top:0;

}


textarea{

width:100%;
height:90px;

background:#292d38;
border:0;
border-radius:15px;

padding:12px;

color:white;

font-size:18px;

box-sizing:border-box;

}



button{

background:#ff5b9a;

border:0;

border-radius:15px;

padding:12px 18px;

color:white;

font-size:16px;

font-weight:bold;

}



.thai{

color:#ff75ad;

font-size:22px;

font-weight:bold;

}



.sound{

background:#343846;

padding:5px 10px;

font-size:14px;

}


.word{

background:#292d38;

border-radius:15px;

padding:12px;

margin-top:10px;

}


.blue{

color:#67b7ff;

}



.small{

font-size:15px;

line-height:1.6;

}


</style>


</head>


<body>


<h1>
🇹🇭 ThaiMate V7
</h1>


<!-- 句子分析 -->

<div class="card">


<h2 class="blue">
🗣 句子分析
</h2>


<textarea placeholder="输入泰语句子，例如：ฉันคิดถึงเธอมาก">

</textarea>


<br><br>


<button>
开始分析
</button>


<div class="small">

等待分析...

</div>


</div>



<!-- 单词分析 -->


<div class="card">


<h2>
🔤 单词分析
</h2>


<textarea placeholder="输入单个泰语词，例如：ไฟ">

</textarea>


<br><br>


<button>
开始分析单词
</button>


<div class="small">

等待分析...

</div>


</div>




<!-- 单词本 -->


<div class="card">


<h2>
📖 我的单词本
</h2>


<div class="word">


ไฟ 🔊 fai /faj/

<br>

火、电灯 · 名词

</div>


<div class="word">


คิดถึง 🔊 khít-thǔng

<br>

想念 · 动词

</div>



</div>



</body>

</html>
